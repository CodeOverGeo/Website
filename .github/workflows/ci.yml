name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # --watch=false is explicit: @angular/build:unit-test infers `watch` from TTY,
      # and a hung job is not worth relying on that inference.
      - run: npm test -- --watch=false
