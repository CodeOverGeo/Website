<header
  #headerRoot
  class="site-header"
  [class.is-wide]="isWide()"
  [class.is-measuring]="isMeasuring()"
>
  <div #headerInner class="header-inner">
    <a class="site-logo" routerLink="/">
      <span>Giovanni Rufino</span>
      <span class="sub">keynotes · workshops</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <button
        class="menu-button"
        type="button"
        [attr.popovertarget]="'site-menu'"
        [attr.popovertargetaction]="'toggle'"
        aria-controls="site-menu"
      >
        <svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <span>Menu</span>
      </button>

      <ul #siteMenu id="site-menu" class="site-menu">
        @for (item of navItems; track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="is-active"
              #rla="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: !!item.exact }"
              [attr.aria-current]="rla.isActive ? 'page' : null"
            >
              {{ item.label }}
            </a>
          </li>
        }
        <li>
          <a
            class="nav-cta"
            routerLink="/contact"
            routerLinkActive="is-active"
            #ctaRla="routerLinkActive"
            [attr.aria-current]="ctaRla.isActive ? 'page' : null"
          >
            Book a Talk
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
