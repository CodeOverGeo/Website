@if (isOpen()) {
<div class="palette-backdrop" (click)="close()">
  <section #paletteSurface class="palette" (click)="$event.stopPropagation()" role="dialog" aria-modal="true"
    aria-label="Command palette">
    <input #paletteInput class="palette-input mono" type="text" placeholder="Type a command..." [value]="query()"
      (input)="onQueryInput($event)" aria-label="Search command" role="combobox" [attr.aria-expanded]="isOpen()"
      aria-controls="palette-listbox" aria-autocomplete="list" autocomplete="off"
      [attr.aria-activedescendant]="filteredItems().length > 0 ? 'palette-item-' + selectedIndex() : null" />

    <div id="palette-listbox" class="palette-list" role="listbox" aria-label="Commands">
      @if (filteredItems().length === 0) {
      <p class="empty-state mono">No matching commands</p>
      } @else {
      @for (item of filteredItems(); track item.label; let idx = $index) {
      <button #paletteOption type="button" class="palette-item" tabindex="-1" [class.selected]="idx === selectedIndex()"
        (click)="execute(item)" [id]="'palette-item-' + idx" role="option"
        [attr.aria-selected]="idx === selectedIndex()">
        <span>{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </button>
      }
      }
    </div>
  </section>
</div>
}
